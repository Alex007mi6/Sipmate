# Render Blueprint — free web service + free Postgres (30-day free DB limit)
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Alex007mi6/Sipmate
#
# Migrations + first-boot seed/import run in docker/entrypoint.sh (free tier
# does not support preDeployCommand).
# Free web services sleep after ~15m idle; cold start ~30–60s.

services:
  - type: web
    name: sipmate
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sipmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        # Update in dashboard if Render assigns a different subdomain
        value: https://sipmate.onrender.com
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: ADMIN_EMAIL
        value: admin@sipmate.example
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHONPATH
        value: /app/backend
      - key: AUTO_BOOTSTRAP
        value: "true"

databases:
  - name: sipmate-db
    plan: free
    databaseName: sipmate
    user: sipmate
