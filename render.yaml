# Render Blueprint — free web service + free Postgres
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → select repo.
# After first deploy, run one-off shell: alembic upgrade head && python scripts/seed.py
# and import/train if models/data are not already in the image.

services:
  - type: web
    name: sipmate
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sipmate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        # Update after first deploy to your real https://….onrender.com
        value: https://sipmate.onrender.com
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: ADMIN_EMAIL
        value: admin@sipmate.example
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHONPATH
        value: /app/backend

databases:
  - name: sipmate-db
    plan: free
    databaseName: sipmate
    user: sipmate
