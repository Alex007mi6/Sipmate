# Render Blueprint — free web service
# Database: use Neon Free (set DATABASE_URL in Render dashboard; sync: false).
# Deploy: https://dashboard.render.com/blueprint/new?repo=https://github.com/Alex007mi6/Sipmate
#
# Migrations + first-boot seed/import run in docker/entrypoint.sh.
# Free web services sleep after ~15m idle; cold start ~30–60s.

services:
  - type: web
    name: sipmate
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        # Neon connection string — set manually in Render Environment (do not sync from Blueprint)
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: CORS_ORIGINS
        value: https://sipmate.onrender.com
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_UPLOAD_DIR
        value: /app/uploads
      - key: FRONTEND_DIST
        value: frontend/dist
      - key: ADMIN_EMAIL
        value: admin@sipmate.example
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PYTHONPATH
        value: /app/backend
      - key: AUTO_BOOTSTRAP
        value: "true"

# Render free Postgres expires after ~30 days; prefer Neon Free for DATABASE_URL.
# databases: []  # intentionally omitted
